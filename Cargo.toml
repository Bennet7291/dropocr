[package]
name = "dropocr"
version = "0.1.0"
edition = "2021"
description = "拖拽图片到 exe 上即自动 OCR 输出 txt 的单文件 Windows 工具"
license = "Apache-2.0"

[[bin]]
name = "dropocr"
path = "src/main.rs"

[dependencies]
tract-onnx = "0.23"
ndarray = "0.16"
image = { version = "0.24", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
imageproc = { version = "0.23", default-features = false }

[profile.release]
opt-level = "z"     # 优先体积而非速度
lto = true          # 链接时优化，显著减小体积、去除死代码
codegen-units = 1   # 更彻底的优化（编译变慢，换体积和性能）
panic = "abort"     # 去掉 unwind 相关代码，减小体积；崩溃直接退出
strip = true        # 去掉符号表和调试信息
